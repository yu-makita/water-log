
name: Train LightGBM Model

on:
  workflow_dispatch:

  schedule:
    # 日本時間の午前3時（UTC 18時）
    - cron: '0 18 * * *'

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lightgbm pandas numpy scikit-learn joblib

      # Cloudflare D1から最新の学習データを取得する
      - name: Export training data from D1
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 export water-log-db \
            --remote \
            --output=../ml/data.sql

      - name: Train model
        run: python ml/train.py

      - name: Export model
        run: python ml/export_model.py
